name: RxNorm release canary

on:
  # Restore a schedule only after independently verified public benchmark
  # inputs are available. M0's synthetic fixtures are never live API inputs.
  workflow_dispatch:
    inputs:
      expected_release:
        description: RxNorm release of the independently verified public benchmark
        required: true
        type: string

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints.txt

concurrency:
  group: rxnorm-release-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime package
        run: python -m pip install -c constraints.txt -e .

      - name: Check public benchmark availability
        id: benchmark
        run: |
          if [[ -f examples/gold_drug_mappings.jsonl && -f examples/faers_sample_products.csv ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Live verification pending: independently verified public benchmark files are absent. Synthetic M0 fixtures must not be used for this probe."
          fi

      - name: Probe official RxNav and compare the public gold cases
        if: steps.benchmark.outputs.available == 'true'
        env:
          BIOSEMALIGN_MODE: ONLINE
          BIOSEMALIGN_RXNAV_BASE_URL: https://rxnav.nlm.nih.gov/REST
          EXPECTED_RXNORM_RELEASE: ${{ inputs.expected_release }}
        run: |
          python scripts/rxnorm_release_canary.py \
            --expected-release "$EXPECTED_RXNORM_RELEASE" \
            --report rxnorm-canary-report.json

      - name: Upload drift report
        if: always() && steps.benchmark.outputs.available == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rxnorm-canary-report
          path: rxnorm-canary-report.json
          if-no-files-found: error
          retention-days: 30
