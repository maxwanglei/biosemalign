[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "biosemalign"
version = "0.1.0.dev0"
description = "A context-aware, knowledge-guided framework for biomedical mapping, coding, and translation"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Lei Wang" }]
keywords = [
    "biomedical",
    "terminology",
    "ontology",
    "rxnorm",
    "umls",
    "semantic-alignment",
    "pharmacovigilance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# Core dependencies are deliberately thin so the base install stays portable to
# HPC and secure research environments. Anything heavy lives behind an extra.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "tenacity>=8.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "structlog>=24.1",
]

[project.optional-dependencies]
data = ["pyarrow>=16.0"]
llm = ["openai>=1.30"]
embeddings = ["sentence-transformers>=3.0"]
omop = ["duckdb>=1.0", "pyarrow>=16.0"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML>=6.0",
    "pyarrow>=16.0",
]

[project.urls]
Homepage = "https://github.com/maxwanglei/biosemalign"
Repository = "https://github.com/maxwanglei/biosemalign"

[project.scripts]
biosemalign = "biosemalign.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/biosemalign"]

[tool.hatch.build.targets.sdist]
include = [
    "src/biosemalign",
    "tests",
    "configs",
    "scripts/check_distribution.py",
    "scripts/rxnorm_release_canary.py",
    "README.md",
    "CHANGELOG.md",
    "constraints.txt",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]
exclude = [
    "/tests/cassettes",
    "/tests/fixtures",
    "/tests/fixtures/restricted",
    "/tests/fixtures/raw_terminology",
    "/data",
    "**/.biosemalign_cache",
    "**/__pycache__",
    "**/*.parquet",
    "**/*.sqlite",
    "**/*.sqlite3",
    "**/.env*",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501",   # line length is handled by the formatter
    "N818",   # exception naming; our error classes read better without "Error" suffix pressure
    "RUF002", # en dashes in prose docstrings are deliberate, not homoglyph mistakes
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

# The data contracts are the thing everything else depends on, so they are held
# to a stricter standard than the rest of the package.
[[tool.mypy.overrides]]
module = "biosemalign.schemas.*"
disallow_untyped_defs = true
disallow_any_generics = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are deselected by default so the standard run is hermetic. An
# autouse fixture additionally blocks outbound sockets, so a test that reaches
# the network without the marker fails rather than silently succeeding.
addopts = "-ra --strict-markers -m 'not network'"
markers = [
    "network: test performs live external requests; deselected by default (run with -m network)",
]
filterwarnings = ["error::DeprecationWarning:biosemalign.*"]

[tool.coverage.run]
source = ["biosemalign"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
