spec_id: toydisease
version: "1.1"
target: ToyDisease
family: [ToyDisease]
subsumption: [is_a]

granularities:
  Disease:
    via: []
    terminal: [Disease]
  Group:
    via: [is_a, in_group]
    max_hops: 2
    terminal: [Group]

release_bound_predicates: [is_a, in_group]
edge_target_classes:
  is_a: Disease
  in_group: Group

losses:
  - kind: specificity
    rule: ancestor
    description: target is broader than the source term
