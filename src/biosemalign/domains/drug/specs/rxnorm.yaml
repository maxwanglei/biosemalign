# RxNorm as a target terminology: the granularity model the v0.2 drug rules
# hard-coded, as data. Changing this file changes mapping behaviour; its digest
# is recorded in decision provenance.
spec_id: rxnorm
version: "1.1"
target: RxNorm
family: [RxNorm, RxNorm Extension]

# OMOP/Athena spell RxNorm term types as concept classes.
class_aliases:
  Ingredient: IN
  Precise Ingredient: PIN
  Multiple Ingredients: MIN
  Brand Name: BN
  Dose Form: DF
  Dose Form Group: DFG
  Clinical Drug: SCD
  Branded Drug: SBD
  Quant Clinical Drug: SCD
  Quant Branded Drug: SBD
  Clinical Drug Comp: SCDC
  Branded Drug Comp: SBDC
  Clinical Drug Form: SCDF
  Branded Drug Form: SBDF
  Clinical Dose Group: SCDG
  Branded Dose Group: SBDG
  Clinical Pack: GPCK
  Branded Pack: BPCK

granularities:
  # MIN is deliberately not terminal: a multiple-ingredient concept looks like
  # an ingredient and is not one; it is decomposed through has_ingredient.
  ingredient:
    via: [has_ingredient]
    terminal: [IN]
    multi: components
    combination_description: >-
      source is a combination product; it is represented by {n} separate
      ingredient concepts and cannot be collapsed to one without misclassifying exposure
  precise_ingredient:
    via: [has_precise_ingredient]
    terminal: [PIN]
    multi: components
    combination_description: >-
      source is a combination product; it is represented by {n} separate
      ingredient concepts and cannot be collapsed to one without misclassifying exposure
  # has_boss (basis of strength) may lead to a precise ingredient as well.
  active_moiety:
    via: [has_boss]
    terminal: [IN]
    accepts: [IN, PIN]
    multi: components
    combination_description: >-
      source is a combination product; it is represented by {n} separate
      ingredient concepts and cannot be collapsed to one without misclassifying exposure

release_bound_predicates: [has_ingredient, has_precise_ingredient, has_boss]
edge_target_classes:
  has_ingredient: IN
  has_precise_ingredient: PIN

salt:
  precise_classes: [PIN]
  base_classes: [IN]
  precise_predicate: has_precise_ingredient

# Applied in order; the first rule of a kind that fires wins.
losses:
  - kind: strength
    rule: pattern
    classes: [SCD, SBD, SCDC, SBDC, GPCK, BPCK]
    pattern: '\b\d+(?:\.\d+)?\s*(?:mg|mcg|µg|ug|g|ml|l|unit|units|iu|%)\b'
    description: target concept does not carry product strength
  - kind: dose_form
    rule: relationship_labels
    classes: [SCD, SBD, SCDF, SBDF, SCDG, SBDG, GPCK, BPCK]
    predicate: has_dose_form
    description: target concept does not carry dose form
  - kind: salt_form
    rule: source_not_selected
    classes: [PIN]
    description: source names a precise ingredient; target is the base ingredient
  - kind: salt_form
    rule: unselected_objects
    exclude_classes: [IN, PIN]
    predicate: has_precise_ingredient
    description: >-
      target is the base ingredient; the source names a specific salt or precise
      ingredient, which the target does not distinguish
  - kind: brand_identity
    rule: relationship_labels
    classes: [SBD, SBDC, SBDF, SBDG, BN, BPCK]
    predicate: has_tradename
    fallback_to_source: true
    description: target concept is generic; brand identity is not preserved
  - kind: route
    rule: context
    field: route
    description: target concept does not carry route of administration

refinement:
  - from: [BN]
    to: [SBD]
    inverse_of: [has_tradename]
    slots: [strength, formulation]
  - from: [IN, PIN]
    to: [SCD, SCDC]
    inverse_of: [has_ingredient, has_precise_ingredient]
    slots: [strength, formulation]
