profile_schema: 2
profile_name: step1_exact_matching
profile_version: 0.1.0
domain: drug
workflow: mapping
description: Step 1 - multi-dictionary exact matching with concordance.

task:
  operation: drug_normalization
  mapping_intent: ingredient_level_analysis

target:
  terminology: RxNorm
  level: ingredient

context:
  fields:
    - name: route
      kind: attribute
      use: [key, resolve, check]
    - name: drug_role
      kind: context
      use: []
    - name: indication
      kind: context
      use: []
    - name: dose
      kind: attribute
      use: [key, resolve, check]
    - name: unit
      kind: attribute
      use: [key]
    - name: formulation
      kind: attribute
      use: [key, resolve, check]

knowledge:
  resources: [RxNorm, UNII]
  allowed_relationships:
    - has_ingredient
    - has_precise_ingredient
    - has_tradename
    - has_dose_form
    - consists_of

tiers:
  - name: exact
    match:
      - op: exact
        options:
          vocabularies: [RxNorm, UNII]
    link:
      op: standard
      options:
        concordance: true
    resolve:
      op: concordant
      options:
        authority_sources: [RxNorm]
        minimum_mention_length: 5

checks:
  - drug.semantics
  - op: policy
    options:
      path: step1_tags.yaml
